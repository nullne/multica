name: multica-test

x-no-proxy: &no-proxy
  no_proxy: backend,postgres,frontend,localhost,127.0.0.1
  NO_PROXY: backend,postgres,frontend,localhost,127.0.0.1
  http_proxy: ""
  HTTP_PROXY: ""
  https_proxy: ""
  HTTPS_PROXY: ""

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica_test
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: multica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    image: golang:1.26-alpine
    working_dir: /app/server
    command: ["sh", "-c", "go run ./cmd/migrate up && go run ./cmd/server"]
    environment:
      <<: *no-proxy
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
      PORT: "8080"
      JWT_SECRET: test-secret
      FRONTEND_ORIGIN: http://frontend:3000
      CORS_ALLOWED_ORIGINS: http://frontend:3000
      LOG_LEVEL: warn
    volumes:
      - ./server:/app/server
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ws://backend:8080/ws
    environment:
      <<: *no-proxy
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # --- Test runners ---

  e2e:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    profiles: [e2e]
    working_dir: /app
    command:
      - sh
      - -c
      - |
        corepack enable && corepack prepare pnpm@10.28.2 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm exec playwright install chromium &&
        pnpm exec playwright test --workers=1
    environment:
      <<: *no-proxy
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      NEXT_PUBLIC_API_URL: http://backend:8080
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
      HOME: /root
      CI: "true"
    volumes:
      - .:/app
      - node_modules_e2e:/app/node_modules
    depends_on:
      frontend:
        condition: service_healthy

  go-test:
    image: golang:1.26-alpine
    profiles: [go-test]
    working_dir: /app/server
    command: ["sh", "-c", "go run ./cmd/migrate up && go test ./..."]
    environment:
      <<: *no-proxy
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
    volumes:
      - ./server:/app/server
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  frontend-test:
    image: node:22-alpine
    profiles: [frontend-test]
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test"]
    volumes:
      - .:/app
      - node_modules_ts:/app/node_modules

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
  node_modules_e2e:
  node_modules_ts:
