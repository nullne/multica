services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica_test
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: multica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica -d multica_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: golang:1.26-alpine
    working_dir: /app/server
    command: ["go", "run", "./cmd/migrate", "up"]
    environment:
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
    volumes:
      - ./server:/app/server
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: golang:1.26-alpine
    working_dir: /app/server
    command: ["go", "run", "./cmd/server"]
    environment:
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
      PORT: "8080"
      JWT_SECRET: test-secret
      FRONTEND_ORIGIN: http://frontend:3000
      LOG_LEVEL: warn
    volumes:
      - ./server:/app/server
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 60s

  install:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm dev:web"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      REMOTE_API_URL: http://backend:8080
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      install:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Test runners — invoked via `docker compose run --rm <service>`
  # ---------------------------------------------------------------------------

  typecheck:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm typecheck"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
    profiles: [test]

  ts-test:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm test"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
    profiles: [test]

  go-test:
    image: golang:1.26-alpine
    working_dir: /app/server
    command: ["go", "test", "./..."]
    environment:
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
    volumes:
      - ./server:/app/server
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [test]

  e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    command: ["sh", "-c", "corepack enable && npx playwright install --with-deps chromium && pnpm exec playwright test"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_PUBLIC_API_URL: http://backend:8080
      DATABASE_URL: postgres://multica:multica@postgres:5432/multica_test?sslmode=disable
      PLAYWRIGHT_BASE_URL: http://frontend:3000
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
    profiles: [test]

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
  node_modules:
  web_next:
