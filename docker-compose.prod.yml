name: multica-prod

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - ${PGDATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/${GHCR_REPO:-nullne/multica}/backend:${IMAGE_TAG:-latest}
    entrypoint: ["./migrate", "up"]
    environment:
      <<: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/${GHCR_REPO:-nullne/multica}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: "8080"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      MULTICA_GITHUB_APP_ID: ${MULTICA_GITHUB_APP_ID:-}
      MULTICA_GITHUB_APP_SLUG: ${MULTICA_GITHUB_APP_SLUG:-}
      MULTICA_GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-key.pem
      MULTICA_GITHUB_APP_WEBHOOK_SECRET: ${MULTICA_GITHUB_APP_WEBHOOK_SECRET:-}
      # NOTE: HTTP_PROXY / HTTPS_PROXY / NO_PROXY are intentionally NOT set
      # here. Docker daemon auto-injects them from ~/.docker/config.json on the
      # host (see "proxies" key). Setting them in compose would override that
      # injection — including overriding to empty when the host has a proxy
      # configured, which broke Firebase cert verification on prod.
      #
      # If you need to override on a particular host, configure that host's
      # ~/.docker/config.json instead. Make sure noProxy includes compose
      # service names: localhost,127.0.0.1,postgres,backend,frontend,migrate
    volumes:
      - ./secrets/github-app-key.pem:/run/secrets/github-app-key.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "unset http_proxy HTTP_PROXY https_proxy HTTPS_PROXY; wget -q --spider http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    # NEXT_PUBLIC_FIREBASE_* are baked into the client bundle at image build
    # time (see apps/web/Dockerfile + .github/workflows/release.yml); they
    # cannot be injected here at runtime.
    image: ghcr.io/${GHCR_REPO:-nullne/multica}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      REMOTE_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
