name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. v0.2.2). Leave empty to deploy latest release."
        required: false
        type: string
      clean:
        description: "Clean deploy: remove existing database and start fresh"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version to deploy (e.g. v0.2.2)."
        required: true
        type: string
      clean:
        description: "Clean deploy: remove existing database and start fresh"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  LISTEN_PORT: ${{ vars.LISTEN_PORT || '80' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      image_exists: ${{ steps.check.outputs.exists }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using specified version: ${{ inputs.version }}"
          else
            LATEST=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
            if [ -z "$LATEST" ]; then
              echo "::error::No releases found. Please specify a version manually."
              exit 1
            fi
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "No version specified — using latest release: $LATEST"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository }}/backend:${VERSION}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE found"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Image $IMAGE not found."
            echo ""
            echo "Available releases:"
            gh release list --repo "${{ github.repository }}" --limit 10 | awk '{print "  " $1}'
            echo ""
            echo "Check https://github.com/${{ github.repository }}/pkgs/container/multica%2Fbackend for available image tags."
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.version }}

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create env file
        run: |
          cat > .env.prod <<'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
          ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }}
          ALLOWED_EMAIL_DOMAINS=${{ secrets.ALLOWED_EMAIL_DOMAINS }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
          S3_BUCKET=${{ secrets.S3_BUCKET }}
          S3_REGION=${{ secrets.S3_REGION || vars.S3_REGION || 'us-west-2' }}
          S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          S3_PUBLIC_URL_BASE=${{ secrets.S3_PUBLIC_URL_BASE }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
          CLOUDFRONT_KEY_PAIR_ID=${{ secrets.CLOUDFRONT_KEY_PAIR_ID }}
          CLOUDFRONT_PRIVATE_KEY=${{ secrets.CLOUDFRONT_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          MULTICA_GITHUB_APP_ID=${{ vars.MULTICA_GITHUB_APP_ID }}
          MULTICA_GITHUB_APP_SLUG=${{ vars.MULTICA_GITHUB_APP_SLUG }}
          MULTICA_GITHUB_APP_WEBHOOK_SECRET=${{ secrets.MULTICA_GITHUB_APP_WEBHOOK_SECRET }}
          LISTEN_PORT=${{ vars.LISTEN_PORT || '80' }}
          PGDATA_DIR=${{ vars.PGDATA_DIR || './data/postgres' }}
          IMAGE_TAG=${{ needs.verify.outputs.version }}
          ENVEOF

      - name: Write GitHub App private key file
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.MULTICA_GITHUB_APP_PRIVATE_KEY }}' > secrets/github-app-key.pem
          chmod 600 secrets/github-app-key.pem

      - name: Clean existing data
        if: inputs.clean
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod down -v 2>/dev/null || true
          PGDATA="${{ vars.PGDATA_DIR || './data/postgres' }}"
          if [ -d "$PGDATA" ]; then
            PARENT="$(cd "$(dirname "$PGDATA")" && pwd)"
            BASE="$(basename "$PGDATA")"
            docker run --rm -v "$PARENT":/parent alpine rm -rf "/parent/$BASE"
          fi
          echo "Cleaned existing data and volumes"

      - name: Pull images
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod pull

      - name: Deploy
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=100

      - name: Wait for health check
        run: |
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${LISTEN_PORT}/health > /dev/null 2>&1; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 5
          done
          echo "Health check failed after 150s"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=100
          exit 1

      - name: Verify deployed version
        run: |
          DEPLOYED=$(curl -sf http://localhost:${LISTEN_PORT}/health | jq -r '.version // "unknown"')
          echo "Deployed version: $DEPLOYED"
          echo "Expected version: ${{ needs.verify.outputs.version }}"

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f .env.prod
          rm -rf secrets/
